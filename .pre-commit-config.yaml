# Pre-commit hooks configuration
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
        require_serial: true
      
      - id: pyright
        name: pyright
        entry: uv run python -m pyright
        language: system
        types: [python]
        pass_filenames: false
        args: [src/merge_segments]
        require_serial: true
      
      - id: pytest
        name: pytest
        entry: uv run python -m pytest
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
