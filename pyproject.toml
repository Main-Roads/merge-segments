[project]
name = "merge_segments"
version = "1.2.0"
authors = [
  {name="Nicholas Archer"},
]
maintainers = [
  {name="Dagmawi Tadesse"},
]
description = "A tool for merging data onto a road network segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=1.5",
  "deprecated>=1.2",
  "numpy>=1.22",
  "numba>=0.63.1",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
progress = [
  "tqdm>=4.66",
]
plotting = [
  "matplotlib>=3.7",
]
performance = [
  "numba>=0.57",
]
polars = [
  "polars>=1.0",
]
dask = [
  "dask[dataframe]>=2024.1",
]
dev = [
  "pytest>=8.4",
  "pytest-cov>=5.0",
  "polars>=1.0",
  "dask[dataframe]>=2024.1",
  "pyright[nodejs]>=1.1",
  "ruff>=0.14",
  "pre-commit>=4.3",
]

[project.urls]
"Homepage" = "https://github.com/Main-Roads/merge-segments"


[build-system]
requires = [
  "hatchling>=1.24",
  "pathspec>=0.11"
]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set explicitly so behaviour doesn't drift with the installed
# ruff version. E4/E7/E9/F is ruff's own long-standing default selection
# (pycodestyle errors + Pyflakes).
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/docs",
]

[tool.hatch.build.targets.wheel]
packages = ["src/merge_segments"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -v --tb=short --capture=no"
# -ra           : (r)show extra test summary (a)ll except passed (A)ll including passed
# -q            : quiet
# --tb=short    : shorter error messages
# --capture=no  : disable pytest comment capture behaviour
# Register custom markers to avoid PyTestUnknownMarkWarning
markers = [
  "slow: marks tests as slow (use -m 'not slow' to skip)"
]

testpaths = [
  "tests"
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright[nodejs]>=1.1",
    "ruff>=0.14",
    "pytest>=8.4",
    "pytest-cov>=5.0",
]

